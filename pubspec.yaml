name: rexios_dev
publish_to: none
version: 1.0.0+1

environment:
  sdk: ^3.10.0

dependencies:
  flutter:
    sdk: flutter

  firebase_core: ^4.2.1
  firebase_analytics: ^12.0.4
  flutter_markdown: ^0.7.1
  url_launcher: ^6.0.7
  get_it: ^9.1.0
  pub_api_client: ^3.2.0
  github: ^9.0.0
  font_awesome_flutter: ^10.0.0
  collection: ^1.16.0
  flutter_svg: ^2.0.7
  flutter_tools_task_queue: ^1.0.0
  platform_plus: ^4.8.1
  fast_rx_flutter: ^0.1.3

dev_dependencies:
  flutter_test:
    sdk: flutter

  rexios_lints: ^17.0.0
  flutter_native_splash: ^2.0.1+1

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/strings/

# flutter pub run flutter_native_splash:create
flutter_native_splash:
  color: '#042a49'
  image: 'assets/images/icon.png'
  android: false
  ios: false